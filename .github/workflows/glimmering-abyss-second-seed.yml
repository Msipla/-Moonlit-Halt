name: Capture verified Phase 7.5 second seed
on:
  push:
    branches: [codex/phase7.5-natural-caverns]
    paths: ['.github/scripts/capture_phase75_second.py', '.github/workflows/glimmering-abyss-second-seed.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-pil
          cd projects/minecraft-mods/experiments/glimmering-abyss
          ./gradlew --no-daemon stageTestMods
      - name: Capture exact validated release
        run: xvfb-run -a python3 -u .github/scripts/capture_phase75_second.py
      - name: Retain all original attempts
        if: always()
        run: |
          path="projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase75/runs/${{ github.run_id }}"
          if [ -d "$path" ]; then
            git config user.name "Glimmering Abyss validation"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$path"
            git commit -m "test(glimmering-abyss): preserve second seed capture ${{ github.run_id }}"
            git pull --rebase origin codex/phase7.5-natural-caverns
            git push origin HEAD:codex/phase7.5-natural-caverns
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-seed-${{ github.run_id }}
          path: projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase75/runs/${{ github.run_id }}
