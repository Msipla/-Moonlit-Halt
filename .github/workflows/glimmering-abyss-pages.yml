name: Publish Glimmering Abyss report
on:
  push:
    branches: [main]
    paths:
      - 'site/glimmering-abyss/**'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase1/**'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase2/**'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/TEST-REPORT.md'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/TEST-REPORT-PHASE2.md'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase4/latest.json'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/TEST-REPORT-PHASE4.md'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase5/latest.json'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/TEST-REPORT-PHASE5.md'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase3/latest.json'
      - 'projects/minecraft-mods/experiments/glimmering-abyss/TEST-REPORT-PHASE3.md'
      - '.github/workflows/glimmering-abyss-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: glimmering-abyss-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sanitized public report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/evidence/phase1/screenshots
          cp site/glimmering-abyss/index.html _site/index.html
          cp site/glimmering-abyss/phase1.html _site/phase1.html
          cp site/glimmering-abyss/exhibition.css site/glimmering-abyss/exhibition.js site/glimmering-abyss/exhibition.json _site/
          cp site/glimmering-abyss/phase2.html _site/phase2.html
          cp site/glimmering-abyss/phase3.html _site/phase3.html
          cp site/glimmering-abyss/phase4.html _site/phase4.html
          cp site/glimmering-abyss/phase5.html _site/phase5.html
          root=projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase1
          cp "$root/summary.json" "$root/audit-glimmer.json" _site/evidence/phase1/
          cp "$root/screenshots/captures.json" _site/evidence/phase1/screenshots/
          cp "$root/screenshots/"*.png _site/evidence/phase1/screenshots/
          test "$(find _site/evidence/phase1/screenshots -name '*.png' | wc -l)" -eq 9
          mkdir -p _site/evidence/phase2/screenshots
          root=projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase2
          cp "$root/summary.json" "$root/performance.csv" "$root/stability.json" _site/evidence/phase2/
          cp "$root/audit-glimmer-a.json" "$root/audit-glimmer-b.json" "$root/audit-glimmer-c.json" _site/evidence/phase2/
          cp "$root/audit-baseline-no-sources-b.json" "$root/audit-baseline-no-sources-c.json" _site/evidence/phase2/
          cp "$root/screenshots/captures.json" _site/evidence/phase2/screenshots/
          cp "$root/screenshots/"*.png _site/evidence/phase2/screenshots/
          test "$(find _site/evidence/phase2/screenshots -name '*.png' | wc -l)" -eq 19
          root=projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase3
          mkdir -p _site/evidence/phase3
          cp "$root/latest.json" _site/evidence/phase3/latest.json
          run=$(python -c 'import json; print(json.load(open("projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase3/latest.json"))["run"])')
          mkdir -p "_site/evidence/phase3/runs/$run/screenshots"
          for file in summary.json performance.csv frame-intervals.json stability.json; do
            cp "$root/runs/$run/$file" "_site/evidence/phase3/runs/$run/"
          done
          cp "$root/runs/$run/screenshots/captures.json" "_site/evidence/phase3/runs/$run/screenshots/"
          cp "$root/runs/$run/screenshots/"*.png "_site/evidence/phase3/runs/$run/screenshots/"
          test "$(find "_site/evidence/phase3/runs/$run/screenshots" -name '*.png' | wc -l)" -eq 21
          root=projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase4
          mkdir -p _site/evidence/phase4
          cp "$root/latest.json" _site/evidence/phase4/latest.json
          # Retain every successful Phase 4 published run, so future pointers cannot break old image URLs.
          for directory in "$root"/runs/*; do
            test -f "$directory/summary.json" || continue
            run=$(basename "$directory")
            mkdir -p "_site/evidence/phase4/runs/$run/screenshots"
            for file in summary.json performance.csv frame-intervals.json architecture-first.json architecture-repeat.json architecture-reload.json client-launch-provenance.json walk-collision.json; do
              cp "$directory/$file" "_site/evidence/phase4/runs/$run/"
            done
            cp "$directory/screenshots/captures.json" "$directory/screenshots/"*.png "_site/evidence/phase4/runs/$run/screenshots/"
          done
          root=projects/minecraft-mods/experiments/glimmering-abyss/evidence/phase5
          mkdir -p _site/evidence/phase5
          cp "$root/latest.json" _site/evidence/phase5/latest.json
          for directory in "$root"/runs/*; do
            test -f "$directory/summary.json" || continue
            run=$(basename "$directory")
            mkdir -p "_site/evidence/phase5/runs/$run/screenshots"
            for file in summary.json performance.csv frame-intervals.json exploration-first.json exploration-repeat.json exploration-reload.json client-launch-provenance.json walk-collision.json rail-collision.json walk-legs.json; do
              cp "$directory/$file" "_site/evidence/phase5/runs/$run/"
            done
            cp "$directory/screenshots/captures.json" "$directory/screenshots/"*.png "_site/evidence/phase5/runs/$run/screenshots/"
          done
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          Path('_site/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }) + '\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
