plugins {
    id 'fabric-loom' version '1.10.5'
}

group = 'dev.mispla'
version = '0.3.2-dev'

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modImplementation('maven.modrinth:valkyrien-skies:qJr3y5vI') { transitive = false }
    modImplementation('maven.modrinth:eureka:Vim9JR4p') { transitive = false }
    modCompileOnly('maven.modrinth:create-fabric:HAqwA6X1') { transitive = false }
}

loom {
    mixin { defaultRefmapName = 'mobilebase-refmap.json' }
    runs {
        server {
            vmArgs '-Xms512m', '-Xmx2g', '-XX:ActiveProcessorCount=4'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
