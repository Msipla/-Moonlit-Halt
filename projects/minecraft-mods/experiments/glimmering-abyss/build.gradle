plugins {
    id 'fabric-loom' version '1.2.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

configurations { testFabricApi }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testFabricApi("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") { transitive = false }
}

loom {
    runs {
        client {
            runDir 'run-client'
            vmArgs '-Xms512M', '-Xmx2G', '-XX:ActiveProcessorCount=4'
            programArgs '--width', '1280', '--height', '720'
            if (project.hasProperty('abyssCapture')) {
                vmArgs '-Dabyss.capture=true', '-Dabyss.port=25585'
            }
        }
        server {
            runDir 'run-server'
            vmArgs '-Xms512M', '-Xmx1500M', '-XX:ActiveProcessorCount=4'
            if (project.hasProperty('abyssTestServer')) vmArgs '-Dabyss.testServer=true'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java { withSourcesJar() }
test { useJUnitPlatform() }
tasks.register('stageTestMods', Copy) {
    from configurations.testFabricApi
    into layout.buildDirectory.dir('test-mods')
}
tasks.named('wrapper') {
    gradleVersion = '8.1.1'
    distributionType = Wrapper.DistributionType.BIN
}
